<!-- Bottom Nav (mobile-first) -->
@if (!rotaPublica) {
  <nav
    class="bn"
    [class.bn--hidden]="!visivel()"
    aria-label="Navegação principal"
  >
    <div class="bn__handle" aria-hidden="true"></div>
    <ul class="bn__list">
      @for (item of itensVisiveis(); track item.key) {
        <li>
          <a
            [routerLink]="item.route"
            class="bn__item"
            [class.bn__item--ativo]="isAtivo(item.route)"
            [attr.aria-label]="item.label"
            [attr.aria-current]="isAtivo(item.route) ? 'page' : null"
            [attr.data-tip]="item.label"
          >
            <svg class="bn__icon" viewBox="0 0 24 24" aria-hidden="true">
              @switch (item.icon) {
                @case ("home") {
                  <path d="m3 11 9-7 9 7" />
                  <path d="M5 10v10h14V10" />
                  <path d="M10 20v-6h4v6" />
                }
                @case ("user") {
                  <path d="M20 21a8 8 0 0 0-16 0" />
                  <circle cx="12" cy="7" r="4" />
                }
                @case ("file") {
                  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                  <path d="M14 3v6h6" />
                  <path d="M8 13h8M8 17h6" />
                }
                @case ("chart") {
                  <path d="M4 19V5" />
                  <path d="M4 19h16" />
                  <rect x="7" y="11" width="3" height="5" rx="1" />
                  <rect x="12" y="8" width="3" height="8" rx="1" />
                  <rect x="17" y="6" width="3" height="10" rx="1" />
                }
                @case ("zap") {
                  <path d="M13 2 4 14h7l-1 8 10-13h-7z" />
                }
                @case ("target") {
                  <circle cx="12" cy="12" r="9" />
                  <circle cx="12" cy="12" r="5" />
                  <circle cx="12" cy="12" r="1.5" />
                }
                @case ("bulb") {
                  <path d="M9 21h6" />
                  <path d="M12 3a6 6 0 0 1 6 6c0 2.2-1.2 4.1-3 5.2V17H9v-2.8A6 6 0 0 1 6 9a6 6 0 0 1 6-6z" />
                }
                @case ("map") {
                  <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" />
                  <line x1="8" y1="2" x2="8" y2="18" />
                  <line x1="16" y1="6" x2="16" y2="22" />
                }
                @case ("settings") {
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                }
              }
            </svg>
            <span class="bn__label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <button
    type="button"
    class="bn-fab"
    (click)="toggle()"
    [attr.aria-label]="visivel() ? 'Esconder menu' : 'Mostrar menu'"
    [attr.data-tip]="visivel() ? 'Esconder menu' : 'Mostrar menu'"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      @if (visivel()) {
        <path d="M6 9l6 6 6-6" />
      } @else {
        <path d="M4 6h16M4 12h16M4 18h16" />
      }
    </svg>
  </button>
}
