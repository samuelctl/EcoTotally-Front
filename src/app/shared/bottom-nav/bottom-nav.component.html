<!-- Bottom Nav (mobile-first) -->
@if (!rotaPublica) {
  <nav class="bn" [class.bn--hidden]="!visivel()" aria-label="Navegação principal">
    <div class="bn__handle" aria-hidden="true"></div>
    <ul class="bn__list">
      @for (item of itens; track item.key) {
        <li>
          <a [routerLink]="item.route" class="bn__item" [class.bn__item--ativo]="isAtivo(item.route)"
             [attr.aria-label]="item.label" [attr.aria-current]="isAtivo(item.route) ? 'page' : null">
            <svg class="bn__icon" viewBox="0 0 24 24" aria-hidden="true">
              @switch (item.icon) {
                @case ('home') { <path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/> }
                @case ('user') { <path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/> }
                @case ('file') { <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h6"/> }
                @case ('chart') { <path d="M4 19V5"/><path d="M4 19h16"/><rect x="7" y="11" width="3" height="5" rx="1"/><rect x="12" y="8" width="3" height="8" rx="1"/><rect x="17" y="6" width="3" height="10" rx="1"/> }
                @case ('zap') { <path d="M13 2 4 14h7l-1 8 10-13h-7z"/> }
                @case ('target') { <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/> }
                @case ('bulb') { <path d="M9 21h6"/><path d="M12 3a6 6 0 0 1 6 6c0 2.2-1.2 4.1-3 5.2V17H9v-2.8A6 6 0 0 1 6 9a6 6 0 0 1 6-6z"/> }
              }
            </svg>
            <span class="bn__label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <button type="button" class="bn-fab" (click)="toggle()"
          [attr.aria-label]="visivel() ? 'Esconder menu' : 'Mostrar menu'"
          [title]="visivel() ? 'Esconder menu (swipe ↓)' : 'Mostrar menu (swipe ↑)'">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      @if (visivel()) {
        <path d="M6 9l6 6 6-6"/>
      } @else {
        <path d="M4 6h16M4 12h16M4 18h16"/>
      }
    </svg>
  </button>
}
