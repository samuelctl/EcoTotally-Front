<main class="eco-page eco-fade-in" style="padding-bottom:40px;">
  <h1 class="eco-h1">Criar conta</h1>
  <p class="eco-subtitle">Cadastre-se para começar a monitorar seu consumo.</p>

  <form class="eco-card" (ngSubmit)="cadastrar()" autocomplete="on">
    <label class="eco-label" for="nome">Nome</label>
    <input id="nome" name="nome" class="eco-input" [(ngModel)]="nome" autocomplete="name" required />

    <label class="eco-label" for="email" style="margin-top:14px;">Email</label>
    <input id="email" name="email" class="eco-input" type="email" autocomplete="email" [(ngModel)]="email" required />

    <label class="eco-label" for="cidade" style="margin-top:14px;">Cidade</label>
    <input id="cidade" name="cidade" class="eco-input" autocomplete="address-level2" [(ngModel)]="cidade" />

    <label class="eco-label" for="senha" style="margin-top:14px;">Senha</label>
    <input id="senha" name="senha" class="eco-input" type="password" autocomplete="new-password" [(ngModel)]="senha" required />

    @if (erro()) { <div class="eco-error">{{ erro() }}</div> }
    @if (ok())   { <div class="eco-success">{{ ok() }}</div> }

    <button class="eco-btn" type="submit" style="margin-top:18px;" [disabled]="loading()">
      @if (loading()) { <span class="eco-spinner"></span> } @else { Cadastrar }
    </button>

    <div style="text-align:center;margin-top:14px;font-size:13px;">
      <a routerLink="/login" style="color:var(--clr-accent);font-weight:600;text-decoration:none;">Já tenho conta</a>
    </div>
  </form>
</main>
